# Render Blueprint — OBO Financial System web service (free plan).
# The database is an external MySQL 8 (e.g. Aiven free MySQL). Render asks
# for every value marked `sync: false` when the Blueprint is created; nothing
# secret is stored in this file. JWT_SECRET is generated by Render.
services:
  - type: web
    name: obo-financial
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_CA
        sync: false
